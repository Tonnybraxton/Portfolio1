<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#06B6D4;stop-opacity:0.3" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background circle with glow -->
  <circle cx="100" cy="100" r="90" fill="url(#glowGradient)" filter="url(#glow)" />
  
  <!-- Main hexagon shape -->
  <path d="M100 20 L170 60 L170 140 L100 180 L30 140 L30 60 Z" 
        fill="none" 
        stroke="url(#logoGradient)" 
        stroke-width="3" />
  
  <!-- Inner hexagon -->
  <path d="M100 40 L150 70 L150 130 L100 160 L50 130 L50 70 Z" 
        fill="url(#logoGradient)" 
        opacity="0.1" />
  
  <!-- Letter M stylized -->
  <path d="M70 80 L70 120 L85 120 L85 95 L100 110 L115 95 L115 120 L130 120 L130 80 L115 80 L100 95 L85 80 Z" 
        fill="url(#logoGradient)" />
  
  <!-- Tech dots -->
  <circle cx="100" cy="50" r="4" fill="#06B6D4" />
  <circle cx="100" cy="150" r="4" fill="#3B82F6" />
  <circle cx="50" cy="100" r="4" fill="#06B6D4" />
  <circle cx="150" cy="100" r="4" fill="#3B82F6" />
</svg>
